name: 加盟店データ自動更新

on:
  schedule:
    - cron: '0 12 * * 5'   # 毎週金曜 夜9:00（日本時間）
  workflow_dispatch:       # Actions画面から手動実行も可
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 公式サイトから取得
        if: github.event_name != 'push'
        run: node scripts/fetch-stores.mjs
      - name: データを保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          git diff --cached --quiet || git commit -m "データ確認 $(TZ=Asia/Tokyo date +%F)"
          git push
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
